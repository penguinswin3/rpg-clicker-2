<div class="button-zone">
  <div class="zone-header">[ QUESTS ]</div>
  <div class="zone-body">
    <ng-container *ngIf="hasAnyButtons; else noButton">
      <div class="action-wrap" *ngIf="action">
        <button
          class="primary-button"
          [attr.data-testid]="'primary-action-' + action.id"
          [appTooltip]="primaryActionTooltip(action)"
          [disabled]="otherButtonsBlockedByRest"
          appHoldToClick
          [holdToClickIntervalMs]="autoClickIntervalMs"
          (appHoldToClick)="onAction()">
          {{ actionLabel }}
        </button>
      </div>

      <div class="timed-action-wrap" *ngFor="let t of timedActionsForActiveCharacter; trackBy: trackTimedAction">
        <button
          class="timed-button"
          [attr.data-testid]="'timed-action-' + t.config.id"
          [style.min-width]="timedActionMinWidthPx(t)"
          [appTooltip]="timedActionTooltip(t.config)"
          [disabled]="t.running || otherButtonsBlockedByRest"
          (click)="onTimedAction(t)">
          <div
            class="timed-button-fill"
            *ngIf="t.running && t.config.duration.type === 'fixed'"
            aria-hidden="true"
            [style.width.%]="t.progress * 100"></div>
          <span class="timed-button-label">{{ timedActionLabel(t) }}</span>
        </button>
      </div>

      <div class="rest-action-wrap" *ngIf="showShortRest">
        <button
          class="rest-button"
          data-testid="short-rest"
          [class.active]="resting"
          [attr.aria-pressed]="resting"
          [appTooltip]="shortRestTooltip()"
          [disabled]="!resting && !canRest"
          (click)="onShortRest()">
          <div class="rest-button-fill" *ngIf="resting" aria-hidden="true" [style.width.%]="hpFraction * 100"></div>
          <span class="rest-button-label">{{ shortRestLabel }}</span>
        </button>
      </div>

      <div class="crafting-action-wrap" *ngFor="let c of holdCraftingActions; trackBy: trackCraftingAction">
        <button
          class="crafting-button hold-craft-button"
          [attr.data-testid]="'crafting-action-' + c.config.id"
          [class.cost-paid]="c.costPaid"
          [style.border-color]="c.costPaid ? costColor(c.config) : null"
          [appTooltip]="craftingTooltip(c.config, c.costPaid)"
          (pointerdown)="onCraftHoldStart(c)"
          (pointerup)="onCraftHoldEnd(c)"
          (pointerleave)="onCraftHoldEnd(c)"
          (pointercancel)="onCraftHoldEnd(c)"
          (keydown.enter)="onCraftHoldStartKeyboard($event, c)"
          (keydown.space)="onCraftHoldStartKeyboard($event, c)"
          (keyup.enter)="onCraftHoldEnd(c)"
          (keyup.space)="onCraftHoldEnd(c)"
          (blur)="onCraftHoldEnd(c)">
          <div class="crafting-button-fill" aria-hidden="true" [style.width.%]="c.progress * 100"></div>
          <span class="crafting-button-label">{{ craftingLabel(c) }}</span>
        </button>
      </div>

      <div class="crafting-action-wrap" *ngFor="let c of clickCraftingActions; trackBy: trackCraftingAction">
        <button
          class="crafting-button click-craft-button"
          [attr.data-testid]="'crafting-action-' + c.config.id"
          [class.cost-paid]="c.costPaid"
          [style.border-color]="c.costPaid ? costColor(c.config) : null"
          [appTooltip]="craftingTooltip(c.config, c.costPaid)"
          (click)="onCraftClick(c)">
          <div class="crafting-button-fill" aria-hidden="true" [style.width.%]="c.progress * 100"></div>
          <span class="crafting-button-label">{{ craftingLabel(c) }}</span>
        </button>
      </div>
    </ng-container>
    <ng-template #noButton>
      <app-empty-state message="No buttons unlocked"></app-empty-state>
    </ng-template>
  </div>
</div>
