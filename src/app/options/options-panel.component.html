<div class="options-panel">
  <div class="section">
    <div class="section-header">// Save</div>
    <button class="action-btn" disabled>Export Save</button>
    <button class="action-btn" disabled>Import Save</button>
    <button class="action-btn danger" disabled>Reset Save</button>
  </div>

  <div class="section">
    <div class="section-header">// Display</div>
    <div class="toggle-row" *ngFor="let opt of displayToggles" (click)="toggle(opt)">
      <span class="toggle-box" [class.on]="opt.enabled">{{ opt.enabled ? 'X' : ' ' }}</span>
      <span class="toggle-label">{{ opt.label }}</span>
    </div>
  </div>

  <div class="version">v{{ version }}</div>
</div>
