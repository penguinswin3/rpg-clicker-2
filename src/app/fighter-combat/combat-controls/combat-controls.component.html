<div class="combat-controls">
  <div class="zone-header">[ COMBAT ]</div>

  <div class="area-select">
    <button
      *ngFor="let area of areas"
      class="area-button"
      [class.active]="selectedAreaId === area.id"
      [attr.aria-pressed]="selectedAreaId === area.id"
      [disabled]="inEncounter"
      (click)="selectArea(area.id)">
      {{ areaLabel(area.id) }}
    </button>
  </div>

  <div class="fight-row">
    <button class="fight-button" *ngIf="!inEncounter" [disabled]="!canFight" (click)="fight()">
      <ng-container *ngIf="canFight; else lockedOut">Fight!</ng-container>
      <ng-template #lockedOut>Recovering... {{ lockedOutSecondsRemaining }}s</ng-template>
    </button>

    <button class="flee-button" *ngIf="inEncounter" (click)="flee()">Flee</button>

    <!-- Stays beside Flee too, so the chain can be switched off mid-fight. -->
    <button
      type="button"
      class="auto-fight"
      role="checkbox"
      data-testid="auto-fight"
      *ngIf="hasAutoFight"
      [attr.aria-checked]="autoFight"
      (click)="toggleAutoFight()">
      <span class="auto-label">Auto</span>
      <span class="auto-box" [class.on]="autoFight" aria-hidden="true">{{ autoFight ? 'X' : ' ' }}</span>
    </button>
  </div>
</div>
