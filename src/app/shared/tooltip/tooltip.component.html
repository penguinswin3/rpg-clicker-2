<div class="tooltip-box" role="tooltip">
  <div class="tooltip-title" *ngIf="title">{{ title }}</div>
  <div class="tooltip-row" [class.wrap]="row.wrap" *ngFor="let row of rows">
    <span class="tooltip-label">{{ row.label }}</span>
    <span class="tooltip-value" [style.color]="row.color || null">{{ row.value }}</span>
  </div>
</div>
